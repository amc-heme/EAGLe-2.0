Jordan_M0-M5:
  label: Jordan M0-M5
  vst_path: /new_raw_data/CD_vst_batchcorrected.rds
  path: /new_raw_data/CD_ROSlow_dds.res.rds
  type: lsc
  species: human
  summary: Pei et al. have previously shown that ROS-low enriched LSCs from primitive
    and monocytic AML differ significantly in their transcriptome and metabolism.
    ROS-low LSCs from monocytic AML in particular, are less dependent on BCL2 therefore
    are more likely to be resistant to Venetoclax-based therapy. This section of analysis
    shows gene expression in primitive vs. monocytic ROS-low LSCs.
  interactive_id: Cancer_Discovery
  t2g: t2g_hs
  ID: SRR
  PCA_var: condition
  PCA_shape: batch
  shape_num: '2'
  batch: 'yes'
  batch_var: batch
  dds_path: /data/CD_ROSlow_dds.rds
  qc_path: /data/CD_qc.rds
  precomputed: no
